# Weights & Biases Sweep Configuration for Crop Futures Prediction
# 
# This sweep systematically searches hyperparameters for the attention_vision_dual_stream model
# Run with: wandb sweep training/wandb_sweep.yaml
# Then: sbatch scripts/run_wandb_sweep.slurm

program: training/train_wandb.py
method: bayes  # Bayesian optimization for efficient search
metric:
  name: val_directional_accuracy
  goal: maximize  # We want to maximize directional accuracy

parameters:
  # Model Architecture
  hidden_dim:
    distribution: categorical
    values: [64, 128, 256]
    
  num_layers:
    distribution: categorical
    values: [1, 2, 3]
    
  dropout:
    distribution: uniform
    min: 0.1
    max: 0.5
    
  # Training Parameters
  lr:
    distribution: log_uniform
    min: 0.0001
    max: 0.01
    
  batch_size:
    distribution: categorical
    values: [16, 32, 64]
    
  seq_len:
    distribution: categorical
    values: [10, 20, 30, 40]
    
  # Fixed parameters (not swept)
  epochs:
    value: 100
    
  model:
    value: attention_vision_dual_stream
    
  commodity:
    value: corn
    
  horizon:
    value: 1
    
  no_early_stopping:
    value: true
    
  output_dir:
    value: training/results_wandb_sweep

# Early stopping for individual runs
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

# Run configuration
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
